<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alumnos - SpringEduManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>Lista de Alumnos</h2>
    <a th:href="@{/alumnos/nuevo}" class="btn btn-primary mb-3">Registrar Nuevo Alumno</a>
    
    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>F. Nacimiento</th>
                    <th>Dirección / Comuna</th>
                    <th>Carrera</th>
                    <th>Email / Teléfono</th>
                    <th>F. Ingreso</th>
                    <th>Matriculado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="alumno : ${alumnos}">
                    <td th:text="${alumno.id}"></td>
                    <td th:text="${alumno.nombre}"></td>
                    <td th:text="${alumno.apellidoPaterno + ' ' + alumno.apellidoMaterno}"></td>
                    <td th:text="${alumno.fechaNacimiento}"></td>
                    <td th:text="${alumno.direccion + ', ' + alumno.comuna}"></td>
                    <td th:text="${alumno.carrera}"></td>
                    <td>
                        <span th:text="${alumno.email}"></span><br>
                        <small class="text-muted" th:text="${alumno.telefono}"></small>
                    </td>
                    <td th:text="${alumno.fechaIngreso}"></td>
                    <td>
                        <span th:if="${alumno.matriculado}" class="badge bg-success">Sí</span>
                        <span th:unless="${alumno.matriculado}" class="badge bg-secondary">No</span>
                    </td>
                    <td>
                        <a th:href="@{/alumnos/editar/{id}(id=${alumno.id})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/alumnos/eliminar/{id}(id=${alumno.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás segura de eliminar este alumno?');">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
