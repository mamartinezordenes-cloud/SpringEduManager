<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4 mb-5">
    <h2 th:text="${alumno.id == null} ? 'Registrar Nuevo Alumno' : 'Actualizar Alumno'">Formulario</h2>
    
    <form th:action="@{/alumnos/guardar}" th:object="${alumno}" method="post" class="needs-validation">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Nombre:</label>
            <input type="text" th:field="*{nombre}" class="form-control" />
            <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Apellido Paterno:</label>
            <input type="text" th:field="*{apellidoPaterno}" class="form-control" />
            <div class="text-danger" th:if="${#fields.hasErrors('apellidoPaterno')}" th:errors="*{apellidoPaterno}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Apellido Materno:</label>
            <input type="text" th:field="*{apellidoMaterno}" class="form-control" />
            <div class="text-danger" th:if="${#fields.hasErrors('apellidoMaterno')}" th:errors="*{apellidoMaterno}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de Nacimiento:</label>
            <input type="date" th:field="*{fechaNacimiento}" class="form-control" />
            <div class="text-danger" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Dirección:</label>
            <input type="text" th:field="*{direccion}" class="form-control" />
            <div class="text-danger" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Comuna:</label>
            <input type="text" th:field="*{comuna}" class="form-control" />
            <div class="text-danger" th:if="${#fields.hasErrors('comuna')}" th:errors="*{comuna}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Carrera que estudia:</label>
            <input type="text" th:field="*{carrera}" class="form-control" />
            <div class="text-danger" th:if="${#fields.hasErrors('carrera')}" th:errors="*{carrera}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email" th:field="*{email}" class="form-control" />
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de Ingreso:</label>
            <input type="date" th:field="*{fechaIngreso}" class="form-control" />
            <div class="text-danger" th:if="${#fields.hasErrors('fechaIngreso')}" th:errors="*{fechaIngreso}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Teléfono:</label>
            <input type="text" th:field="*{telefono}" class="form-control" />
            <div class="text-danger" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" th:field="*{matriculado}" class="form-check-input" id="matriculadoCheck" />
            <label class="form-check-label" for="matriculadoCheck">Matriculado</label>
            <div class="text-danger" th:if="${#fields.hasErrors('matriculado')}" th:errors="*{matriculado}"></div>
        </div>

        <button type="submit" class="btn btn-success">Guardar Alumno</button>
        <a th:href="@{/alumnos}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
